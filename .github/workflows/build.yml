name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project if it was uploaded as a zip
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" && echo "Unzipped $z"; done || true
      - name: Show repo layout and find project
        id: find
        run: |
          ls -la
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './node_modules/*' | head -n 1)")
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GearOn-debug-apk
          path: |
            ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.find.outputs.dir }}/app/build/reports
